# DATAD continuous integration.
#
# The suite this runs was already green — 76 suites, 1120 tests — but it was
# green only when somebody remembered to run it. That is the gap this file
# closes: the quality signal now fires on every push rather than on discipline.
#
# Three jobs, deliberately separate rather than one sequential pipeline. A
# failing lint should not hide a failing test, and an advisory published against
# a dependency should be legible as its own event and not as "CI is red again".
name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# A second push to the same branch makes the first run's result irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Local development runs Node 24; pinning the major here keeps CI from
  # disagreeing with the machine the code was written on.
  NODE_VERSION: '24'

jobs:
  server:
    name: Server tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # tests/helpers/testDb.js needs a reachable cluster — it does not use
    # mongodb-memory-server. It refuses any database whose name does not match
    # /(^|[-_])test([-_]|$)/, then appends a per-test-file suffix so suites
    # cannot clear each other's fixtures. A throwaway service container
    # satisfies all of that without putting Atlas credentials in CI, which also
    # means a runaway `deleteMany` has nothing real to delete.
    services:
      mongodb:
        image: mongo:7
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      MONGODB_TEST_URI: mongodb://localhost:27017/datad-test
      # tests/setup/safeEnv.js strips every outbound credential from the test
      # process unless ALLOW_REAL_EXTERNAL_CALLS=1. Nothing here sets it, and
      # nothing here should: `npm run test:integration` is the opt-in path, and
      # it is deliberately not wired to CI. The 2026-08-22 incident — a test run
      # that mailed real people through production Brevo keys — is the reason
      # that opt-in has to stay a human decision.
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install
        working-directory: server
        run: npm ci

      - name: Test
        working-directory: server
        run: npm test

  client:
    name: Client lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install
        working-directory: client
        run: npm ci

      # `--max-warnings 50` lives in the package script. Errors fail the job;
      # the warning budget is there so a slow drift becomes visible as a budget
      # that is filling up rather than as noise everyone has learned to scroll
      # past.
      - name: Lint
        working-directory: client
        run: npm run lint

      # Render's build command is `cd client && npm install && npm run build`.
      # Running the real build here means a broken production bundle is caught
      # on push rather than mid-deploy, when the service is already down.
      - name: Build
        working-directory: client
        run: npm run build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Both trees currently report zero. This job exists to tell you the day
    # that stops being true — which is usually the day an advisory is published,
    # not the day anybody touched this repository.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Production dependencies only. A dev-only advisory is worth knowing about
      # but is not worth blocking a deploy on: it never reaches a user, and a
      # gate that fires on things nobody can act on is a gate people start
      # ignoring.
      - name: Audit server
        working-directory: server
        run: npm audit --omit=dev --audit-level=high

      - name: Audit client
        working-directory: client
        run: npm audit --omit=dev --audit-level=high
