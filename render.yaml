services:
  - type: web
    name: datad
    runtime: node
    plan: free
    rootDir: .
    buildCommand: cd client && npm install && npm run build && cd ../server && npm install
    startCommand: cd server && npm start
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        sync: false
      - key: BASE_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Mail goes out over Gmail SMTP (config/mailer.js). Without BOTH of
      # these the mailer disables itself silently and email verification —
      # which registration requires — never arrives, so nobody can sign up.
      # GMAIL_APP_PASSWORD is a Google App Password, not the account password.
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: NODE_ENV
        value: production
      - key: NVIDIA_API_KEY
        sync: false
      - key: AI_PRIMARY_PROVIDER
        value: nvidia
      # Ollama is a localhost service and does not exist on Render — pointing
      # the fallback at it guarantees the fallback fails. Leaving it unset
      # means a failed primary surfaces as an error instead of a hang.
      - key: AI_FALLBACK_PROVIDER
        sync: false
