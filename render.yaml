# Sizing note (see DEPLOYMENT.md § Production resources for the full rationale).
#
# `free` is not a viable plan for this service, for two reasons that are not
# about raw capacity:
#
#   1. Free instances spin down after ~15 minutes idle. All 23 cron jobs run
#      in-process (server/schedulers/index.js) — daily briefings, case studies,
#      moderation, the trial-expiry job that is the ONLY thing downgrading
#      lapsed paid tiers, and the 02:30 UTC profile snapshot, whose history
#      cannot be backfilled. A sleeping instance runs none of them.
#   2. Free is 512 MB, and uploads are buffered in memory. The upload limits
#      have been cut to fit (server/middleware/uploadGuards.js), but there is
#      no headroom left for concurrency on top.
#
# Running on `free` deliberately until monetisation covers the upgrade. That is
# a viable launch position ONLY with the two mitigations below; without them the
# failure modes are silent, which is the dangerous kind.
#
#   1. Spin-down. Keep the instance warm by pinging /api/health every 10 minutes
#      from an external scheduler (cron-job.org, UptimeRobot — both free). A
#      sleeping instance runs no crons at all, and trialExpiryReminder is the
#      only thing that downgrades lapsed paid tiers: without it, someone whose
#      Pro month ended keeps Pro forever. Free gives 750 instance-hours/month,
#      which covers one service running continuously.
#   2. Memory. 512 MB total, and uploads are buffered in heap. The UPLOAD_MAX_*
#      values below are set well under the defaults in
#      server/middleware/uploadGuards.js for this reason.
#
# Move to `starter` the moment there is revenue: it is always-on, which removes
# mitigation 1 entirely. Then `standard` (2 GB) if OOM restarts appear.
#
# Keep this at a single instance. The schedulers have no distributed lock, so
# every additional instance re-runs every cron — duplicate briefings, duplicate
# newsletters, duplicate reminder emails.
services:
  - type: web
    name: datad
    runtime: node
    plan: free
    numInstances: 1
    rootDir: .
    # `--include=dev` on the client is load-bearing. NODE_ENV=production is set
    # on this service (below), and npm omits devDependencies whenever NODE_ENV
    # is production — but vite is a devDependency, so `npm run build` dies with
    # "vite: not found". The very first deploy of a blueprint builds before its
    # env vars are applied, so this fails on the SECOND deploy and every one
    # after, which is a confusing way to find out.
    #
    # The server install stays production-only on purpose: nothing it needs at
    # runtime is a devDependency, and jest et al. have no business in the image.
    buildCommand: cd client && npm install --include=dev && npm run build && cd ../server && npm install
    startCommand: cd server && npm start
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        sync: false
      # The API's own public origin, used to build the one-click approve link in
      # the registration alert email (server/utils/clientUrl.js serverLinkBase).
      # Resolved from the service rather than typed in: a hand-entered value is
      # one typo away from mailing the admin a dead button, and the failure is
      # invisible until someone actually clicks it. Render substitutes the
      # hostname only, so the scheme is added when the link is built.
      #
      # Set this manually only if a custom domain is in front of the API — then
      # it must be that domain, since the onrender.com host would still work but
      # would leak the internal name into the admin's inbox.
      - key: BASE_URL
        fromService:
          type: web
          name: datad
          property: host
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Mail (config/mailTransport.js). Registration gates on a verification
      # link, so with no transport configured nobody can sign up.
      #
      # Brevo is the production provider. Gmail SMTP caps out around 500
      # recipients/day, and that cap stops signups platform-wide once reached —
      # it is a development transport, not a launch one.
      #
      # BREVO_API_KEY is the HTTP API credential ("xkeysib-…"). Optionally set
      # BREVO_SMTP_API_KEY ("xsmtpsib-…") instead to use the SMTP relay.
      # BREVO_FROM_EMAIL must be on a domain verified in the Brevo account.
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_FROM_EMAIL
        sync: false
      - key: BREVO_FROM_NAME
        sync: false
      # Legacy Gmail fallback — used only when no Brevo credential is set.
      # GMAIL_APP_PASSWORD is a Google App Password, not the account password.
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: NODE_ENV
        value: production
      # Runs the BusEvent consumer inside this process instead of as its own
      # service (server/events/pollLoop.js). Render has no free plan for
      # background workers — they start at `starter` — so the alternative on a
      # free deploy is not a slower worker, it is no worker: every talent flow,
      # profile refresh and notification bridge writes rows that stay `pending`
      # forever, silently.
      #
      # Set this to false the moment the datad-worker service below is enabled.
      # Both polling is wasteful but not incorrect — pollBatch() claims each row
      # with an atomic pending→processing transition, so nothing double-runs.
      # Quoted deliberately. Unquoted `true` is a YAML boolean, and how a
      # platform serialises that into a process env var is its business, not
      # something to bet a silent failure mode on. The string is unambiguous.
      - key: RUN_WORKER_IN_PROCESS
        value: "true"
      # Sized for a 512 MB free instance. multer buffers uploads in heap and
      # three call sites then build a base64 data-URI from the buffer, so peak
      # is ~2.4x the file size per concurrent upload. Raise these on `starter`
      # or `standard`; see DEPLOYMENT.md § Production resources.
      - key: UPLOAD_MAX_IMAGE_MB
        value: 8
      - key: UPLOAD_MAX_DOC_MB
        value: 10
      - key: UPLOAD_MAX_STUDIO_FILE_MB
        value: 10
      - key: UPLOAD_MAX_STUDIO_FILES
        value: 3
      - key: UPLOAD_MAX_STUDIO_REQUEST_MB
        value: 25
      # ── AI providers ────────────────────────────────────────────────────────
      #
      # _candidateOrder() in ai/providers/index.js prepends AI_PRIMARY_PROVIDER,
      # so it overrides PROVIDER_ORDER. This was `nvidia`, which put NVIDIA ahead
      # of Cloudflare in the chat failover path — and NVIDIA's balanced-class
      # model measured 3.2-13.2s over three runs on 2026-08-18 against
      # Cloudflare's 692ms for the same capability class. Groq is primary, with
      # Cloudflare as the fast backup. See server/scripts/verifyProviders.js.
      #
      # Every provider in the chain needs its credential HERE. A chain naming a
      # provider whose key never reached the deploy is not a chain — it is a
      # single provider with extra steps, and the gap only shows when the
      # primary is already failing.
      - key: AI_PRIMARY_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      # Groq's default whenever it is called without an explicit model. The
      # library default (llama-3.3-70b-versatile) 404s — a live catalogue probe
      # on 2026-08-18 found this account serves no Llama models at all.
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_AI_TOKEN
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      # Ollama is a localhost service and does not exist on Render — pointing
      # the fallback at it guarantees the fallback fails. Leaving it unset
      # means a failed primary surfaces as an error instead of a hang.
      - key: AI_FALLBACK_PROVIDER
        sync: false
      # ── Payments (server/payments/razorpay.js) ──────────────────────────────
      #
      # All three are sync: false and deliberately have no value here. They must
      # be LIVE keys (`rzp_live_…`): isTestMode() keys the UI off the `rzp_test`
      # prefix, so test keys deploy as a working-looking checkout that moves no
      # real money.
      #
      # Unset degrades cleanly rather than crashing — isConfigured() is false and
      # checkout is simply not offered. That is the correct state until real keys
      # exist; a half-configured gateway is worse than an absent one.
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      # A SEPARATE secret from KEY_SECRET, generated when the webhook endpoint is
      # created in the Razorpay dashboard — not a copy of the API secret.
      # Webhooks are configured independently, so checkout works without this;
      # what breaks is every server-side confirmation that does not come back
      # through the browser.
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      # ── Web Push (notifications/PushService.js) ─────────────────────────────
      #
      # The only channel that reaches a student whose PWA is closed. SSE
      # (NotificationStream) needs an open, foregrounded tab; this puts a banner
      # on a locked phone. Unset, the channel is inert — the Settings toggle
      # says so, /notifications/push/subscribe answers 503, and nothing else
      # changes — so a missing key here is a silent absence of notifications
      # rather than a visible failure.
      #
      # `sync: false` on the pair because the private key is a credential.
      # Generate ONCE with `npx web-push generate-vapid-keys` and paste both in
      # the dashboard: every subscription a browser has granted is bound to the
      # public key, so regenerating them silently mutes every device that has
      # already opted in. There is no migration — only re-consent.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      # Contact the push service uses if our subscriptions misbehave. Not a
      # secret, so it lives here rather than in the dashboard.
      - key: VAPID_SUBJECT
        value: mailto:support@datad.app
      # Error tracking (web) (server/observability/errorTracker.js). With neither of
      # these set the only sink is the structured log — no alert fires, and the
      # first report of an outage is a student mentioning it. /api/health
      # reports the live sinks as `errorTracking`; a bare `log` in production
      # means a DSN never reached the deploy. Set at least one.
      - key: SENTRY_DSN
        sync: false
      # A plain JSON POST — Slack/Discord webhooks work as-is.
      - key: ERROR_WEBHOOK_URL
        sync: false
      # ── Client build-time values ────────────────────────────────────────────
      #
      # Vite inlines VITE_* into the bundle during `npm run build`, which runs
      # in this service's build step. They are therefore read at build time
      # only: changing one needs a redeploy, not a restart.
      #
      # VITE_API_BASE_URL is deliberately absent. It defaults to a relative
      # `/api` (client/src/api/axios.js), which is what same-origin serving
      # needs; an absolute URL would send the browser off its own origin and
      # reintroduce the CORS surface this single-service layout removes.
      #
      # The UPI pair is the payee on the subscription checkout QR
      # (components/subscription/CheckoutSummary.jsx). Unset, it falls back to
      # `datad@upi` — a placeholder, not an account anyone here controls — so
      # students would scan a QR that pays a stranger, and every payment would
      # look successful from their side. Set both before taking money.
      - key: VITE_UPI_VPA
        sync: false
      - key: VITE_UPI_NAME
        value: DATAD
      # A different DSN from SENTRY_DSN above: browser project, not server.
      # Optional — reportError also POSTs to /api/telemetry/error, so frontend
      # crashes reach the server pipeline regardless. The DSN adds grouping,
      # breadcrumbs and session replay.
      - key: VITE_SENTRY_DSN
        sync: false

  # ── Event worker ────────────────────────────────────────────────────────────
  #
  # Consumes the BusEvent collection (server/worker.js): polls for pending
  # events every 5s in batches of 20 and dispatches to the handlers registered
  # in server/events/handlers/index.js. The API server deliberately does NOT
  # run this loop — async work must never block the request path.
  #
  # Without this service the talent flows (application, engagement, review,
  # opportunity), the profile-refresh handler and the notification bridge all
  # write BusEvent rows that are never consumed. They accumulate as `pending`
  # forever, silently.
  #
  # Unlike the web service, this one is safe to scale: it runs no cron, so
  # there is nothing to duplicate. Concurrency is bounded by whatever claim
  # semantics events.pollBatch() uses — verify those before raising
  # numInstances above 1.
  #
  # `plan: free` does not exist for worker services on Render — background
  # workers start at `starter`, $7/month. That is the entire cost of this
  # blueprint, so the service is COMMENTED OUT and the loop runs inside the web
  # service instead (RUN_WORKER_IN_PROCESS above). The whole deployment is $0.
  #
  # To turn it back on when there is revenue: uncomment the block below, then
  # set RUN_WORKER_IN_PROCESS to false on the web service. Do it in that order —
  # both running briefly is harmless (pollBatch claims rows atomically), neither
  # running is not.
  #
  # - type: worker
  #   name: datad-worker
  #   runtime: node
  #   plan: starter
  #   numInstances: 1
  #   rootDir: .
  #   buildCommand: cd server && npm install
  #   startCommand: cd server && node worker.js
  #   envVars:
  #     - key: MONGODB_URI
  #       sync: false
  #     - key: NODE_ENV
  #       value: production
  #     # Notification payloads embed deep links back into the app.
  #     - key: CLIENT_URL
  #       sync: false
  #     # Same origin as the web service — see the BASE_URL note there.
  #     - key: BASE_URL
  #       fromService:
  #         type: web
  #         name: datad
  #         property: host
  #     # The profile handler rebuilds the intelligence profile, which calls the
  #     # AI gateway — so the worker needs provider credentials of its own.
  #     # Mirror the web service exactly, including the whole failover chain:
  #     # a worker with only the primary's key silently loses its fallback.
  #     - key: AI_PRIMARY_PROVIDER
  #       value: groq
  #     - key: GROQ_API_KEY
  #       sync: false
  #     - key: GROQ_MODEL
  #       value: openai/gpt-oss-20b
  #     - key: CLOUDFLARE_ACCOUNT_ID
  #       sync: false
  #     - key: CLOUDFLARE_AI_TOKEN
  #       sync: false
  #     - key: NVIDIA_API_KEY
  #       sync: false
  #     # No Ollama fallback on Render — see the web service note.
  #     - key: AI_FALLBACK_PROVIDER
  #       sync: false
  #     # Error tracking (worker). worker.js routes boot failures, crashes and
  #     # failed poll cycles through the same errorTracker seam as the API, so
  #     # these do reach a sink here. Use the SAME values as the web service —
  #     # the `source` field ("crash"/"job") and the `process: worker` context
  #     # already separate the two, and a second DSN just splits one incident
  #     # across two projects.
  #     #
  #     # This is the service where an alert matters most: a stalled worker has
  #     # no user-visible symptom. The queue stops draining, BusEvent rows
  #     # accumulate as `pending`, and everything looks healthy from outside.
  #     - key: SENTRY_DSN
  #       sync: false
  #     - key: ERROR_WEBHOOK_URL
  #       sync: false
